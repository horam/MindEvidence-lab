<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MindEvidence Lab</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top">
  <h1>MindEvidence Lab</h1>
  <p class="note">Teaching tool. All patients are synthetic. Answers here are <strong>mock data</strong> until the backend is connected.</p>
</header>
<main class="grid">
  <nav aria-label="Patients"><h2>Patients</h2><ul id="patients"></ul></nav>
  <section aria-labelledby="detail-h">
    <h2 id="detail-h">Patient</h2>
    <div id="detail"><p class="empty">Select a patient to begin.</p></div>
    <h2>Ask</h2>
    <form id="ask">
      <label>Mode
        <select id="mode">
          <option value="both">Both</option><option value="rag">RAG</option>
          <option value="general">General knowledge</option><option value="auto">Auto</option>
        </select>
      </label>
      <input id="q" required maxlength="2000" placeholder="e.g. What does the evidence say about brief interventions?" aria-label="Question">
      <button>Ask question</button>
    </form>
    <div id="answer" aria-live="polite"></div>
  </section>
  <aside aria-label="Evidence and activity">
    <h2>Evidence inspector</h2><div id="evidence"><p class="empty">Evidence appears after you ask a question.</p></div>
    <h2>Activity</h2><ol id="log" class="log"></ol>
  </aside>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
